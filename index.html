<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Label Cropper — Flipkart · Amazon · Meesho</title>
<style>
:root{--bg:#f4f6fb;--surface:#ffffff;--text:#1a1d29;--muted:#6b7280;--border:#e5e7eb;--accent:#6d28d9;--accent2:#9333ea;--fk:#2874f0;--az:#ff9900;--ms:#d9308f;--err:#dc2626;--radius:16px;color-scheme:light dark;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0f1117;--surface:#1a1d29;--text:#f3f4f6;--muted:#9ca3af;--border:#2d3140;}}
:root[data-theme="dark"]{--bg:#0f1117;--surface:#1a1d29;--text:#f3f4f6;--muted:#9ca3af;--border:#2d3140;}
*{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10;}
.wrap{max-width:680px;margin:0 auto;padding:28px 16px 48px;}
header{text-align:center;margin-bottom:20px;}
h1{font-size:1.55rem;margin:0 0 6px;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;}
p.sub{color:var(--muted);margin:0 0 4px;font-size:.92rem;}
p.trust{color:var(--muted);margin:0;font-size:.76rem;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.04);}
.label{font-weight:700;margin-bottom:10px;font-size:.84rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;}
.sel{display:flex;gap:8px;flex-wrap:wrap;}
.sel button{flex:1;min-width:76px;border:2px solid var(--border);background:transparent;color:var(--text);padding:11px 6px;border-radius:12px;font-weight:700;cursor:pointer;font-size:.86rem;transition:.15s;}
.sel button.active[data-k="auto"]{border-color:var(--accent);background:rgba(109,40,217,.14);}
.sel button.active[data-k="flipkart"]{border-color:var(--fk);background:rgba(40,116,240,.14);}
.sel button.active[data-k="amazon"]{border-color:var(--az);background:rgba(255,153,0,.16);}
.sel button.active[data-k="meesho"]{border-color:var(--ms);background:rgba(217,48,143,.14);}
.drop{border:2px dashed var(--border);border-radius:14px;padding:30px 16px;text-align:center;cursor:pointer;color:var(--muted);transition:.15s;}
.drop.drag{border-color:var(--accent);background:rgba(109,40,217,.08);}
.drop .ic{font-size:2.1rem;margin-bottom:4px;}
.tip{font-size:.76rem;color:var(--muted);margin-top:6px;}
.filelist{margin-top:14px;display:flex;flex-direction:column;gap:8px;}
.frow{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--border);border-radius:11px;padding:9px 10px;font-size:.82rem;}
.frow .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.badge{padding:3px 9px;border-radius:999px;font-size:.68rem;font-weight:800;color:#fff;white-space:nowrap;}
.b-flipkart{background:var(--fk);} .b-amazon{background:var(--az);} .b-meesho{background:var(--ms);} .b-bad{background:var(--err);}
.frow .rm{cursor:pointer;color:var(--muted);background:none;border:none;font-size:1.05rem;line-height:1;padding:2px 4px;}
.go{width:100%;padding:15px;border:none;border-radius:13px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:1rem;font-weight:800;cursor:pointer;margin-top:16px;}
.go:disabled{opacity:.45;cursor:not-allowed;}
.status{text-align:center;font-size:.85rem;color:var(--muted);margin-top:10px;min-height:1.2em;}
.spinner{width:15px;height:15px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;display:inline-block;animation:spin .7s linear infinite;vertical-align:middle;margin-right:7px;}
@keyframes spin{to{transform:rotate(360deg);}}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--err);color:#fff;padding:11px 18px;border-radius:11px;font-size:.84rem;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:200;max-width:88%;text-align:center;}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:14px;}
.modal{background:var(--surface);border-radius:18px;padding:18px;max-width:460px;width:100%;max-height:92vh;overflow:auto;display:flex;flex-direction:column;gap:11px;}
.modal h3{margin:0;}
.modal iframe{width:100%;height:46vh;border:1px solid var(--border);border-radius:11px;background:#fff;}
.row2{display:flex;gap:10px;}
.row2 button{flex:1;padding:13px;border-radius:12px;border:none;font-weight:800;cursor:pointer;font-size:.92rem;}
.btn-ghost{background:var(--bg);color:var(--text);border:1px solid var(--border)!important;}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;}
.confirm{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:60;padding:16px;}
.confirm .box{background:var(--surface);padding:22px;border-radius:16px;max-width:320px;text-align:center;}
</style>
</head>
<body>
<div class="wrap">
 <header>
  <h1>📦 Label Cropper</h1>
  <p class="sub">Strips the tax invoice, keeps only the shipping label</p>
  <p class="trust">Runs entirely in your browser — files never leave your device</p>
 </header>

 <div class="card">
  <div class="label">Platform</div>
  <div class="sel" id="sel">
   <button data-k="auto" class="active">🔍 Auto</button>
   <button data-k="flipkart">Flipkart</button>
   <button data-k="amazon">Amazon</button>
   <button data-k="meesho">Meesho</button>
  </div>
 </div>

 <div class="card">
  <div class="drop" id="drop">
   <div class="ic">⬆️</div>
   <div>Tap to upload or drop label PDF(s) here</div>
   <div class="tip">Multiple files are merged into one print-ready PDF</div>
  </div>
  <input type="file" id="file" accept="application/pdf,.pdf" multiple hidden>
  <div class="filelist" id="filelist"></div>
  <button class="go" id="go" disabled>✂️ Crop &amp; Prepare Labels</button>
  <div class="status" id="status"></div>
 </div>
</div>

<div id="modalRoot"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

// Preset crop presets: "top" = fraction of full page height, measured from the top,
// that contains the shipping label on each platform's standard combined label+invoice
// template. Tuned from a real Flipkart sample; Amazon/Meesho are best-effort estimates
// for their common templates. Pages already sized like a 4x6in label (no invoice
// attached) are detected automatically and left uncropped.
const PLAT = {
  flipkart: { label: 'Flipkart', kw: ['flipkart', 'e-kart', 'ekart logistics', 'fkart'], top: 0.62 },
  amazon:   { label: 'Amazon',   kw: ['amazon', 'easy ship', 'fulfilled by amazon', 'amazon.in', 'amazon transportation'], top: 0.48 },
  meesho:   { label: 'Meesho',   kw: ['meesho', 'valmo', 'meesho logistics'], top: 0.45 }
};

let files = [];
let selectedPlatform = 'auto';

function detect(text) {
  for (const k in PLAT) { if (PLAT[k].kw.some(w => text.includes(w))) return k; }
  return null;
}
function validateEntry(e) {
  if (!e.detected) { e.valid = false; e.plat = null; return; }
  if (selectedPlatform === 'auto') { e.valid = true; e.plat = e.detected; }
  else { e.valid = (e.detected === selectedPlatform); e.plat = selectedPlatform; }
}
function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function showToast(msg) {
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3800);
}
function setStatus(html) { document.getElementById('status').innerHTML = html; }
function updateGoState() { document.getElementById('go').disabled = !files.some(e => e.valid); }

function renderList() {
  const wrap = document.getElementById('filelist');
  wrap.innerHTML = files.map((e, i) => {
    let badge;
    if (e.processing) badge = '<span class="spinner"></span>';
    else if (e.detected && e.valid) badge = '<span class="badge b-' + e.detected + '">' + PLAT[e.detected].label + '</span>';
    else badge = '<span class="badge b-bad">✕ Unsupported</span>';
    return '<div class="frow"><span class="name">' + escapeHtml(e.file.name) + '</span>' + badge +
      '<button class="rm" data-i="' + i + '">✕</button></div>';
  }).join('');
}
document.getElementById('filelist').addEventListener('click', e => {
  const btn = e.target.closest('.rm'); if (!btn) return;
  files.splice(Number(btn.dataset.i), 1);
  renderList(); updateGoState();
});

async function processFile(entry) {
  try {
    const pdf = await pdfjsLib.getDocument({ data: entry.bytes.slice(0) }).promise;
    const page = await pdf.getPage(1);
    const tc = await page.getTextContent();
    const text = tc.items.map(it => it.str).join(' ').toLowerCase();
    entry.detected = detect(text);
  } catch (err) { entry.detected = null; }
  entry.processing = false;
  validateEntry(entry);
  if (!entry.valid) {
    showToast(selectedPlatform === 'auto'
      ? '"' + entry.file.name + '" isn’t a recognized Flipkart, Amazon or Meesho label.'
      : '"' + entry.file.name + '" doesn’t look like a ' + PLAT[selectedPlatform].label + ' label.');
  }
  renderList(); updateGoState();
}
async function addFiles(fileList) {
  for (const file of fileList) {
    if (file.type !== 'application/pdf' && !file.name.toLowerCase().endsWith('.pdf')) {
      showToast('"' + file.name + '" skipped — not a PDF.'); continue;
    }
    const bytes = await file.arrayBuffer();
    const entry = { file, bytes, detected: null, valid: false, processing: true, plat: null };
    files.push(entry);
    renderList();
    await processFile(entry);
  }
  updateGoState();
}

const dropEl = document.getElementById('drop');
const fileInput = document.getElementById('file');
dropEl.onclick = () => fileInput.click();
fileInput.onchange = e => { addFiles(e.target.files); fileInput.value = ''; };
dropEl.addEventListener('dragover', e => { e.preventDefault(); dropEl.classList.add('drag'); });
['dragleave', 'drop'].forEach(ev => dropEl.addEventListener(ev, e => { e.preventDefault(); dropEl.classList.remove('drag'); }));
dropEl.addEventListener('drop', e => { if (e.dataTransfer.files.length) addFiles(e.dataTransfer.files); });

document.getElementById('sel').addEventListener('click', e => {
  const btn = e.target.closest('button'); if (!btn) return;
  selectedPlatform = btn.dataset.k;
  [...document.querySelectorAll('#sel button')].forEach(b => b.classList.toggle('active', b === btn));
  files.forEach(validateEntry);
  renderList(); updateGoState();
});

document.getElementById('go').addEventListener('click', doCrop);
async function doCrop() {
  const valid = files.filter(f => f.valid);
  if (!valid.length) return;
  const goBtn = document.getElementById('go'); goBtn.disabled = true;
  setStatus('<span class="spinner"></span>Cropping &amp; merging labels…');
  try {
    const merged = await PDFLib.PDFDocument.create();
    for (const f of valid) {
      const src = await PDFLib.PDFDocument.load(f.bytes.slice(0));
      const idxs = src.getPageIndices();
      const copied = await merged.copyPages(src, idxs);
      const topFrac = PLAT[f.plat].top;
      copied.forEach(p => {
        merged.addPage(p);
        const { width, height } = p.getSize();
        if (height > 460) {
          const keepH = height * topFrac;
          p.setMediaBox(0, height - keepH, width, keepH);
          p.setCropBox(0, height - keepH, width, keepH);
        }
      });
    }
    const bytes = await merged.save();
    const blob = new Blob([bytes], { type: 'application/pdf' });
    const url = URL.createObjectURL(blob);
    openPreview(url, merged.getPageCount(), valid.length);
    setStatus('');
  } catch (err) {
    setStatus('');
    showToast('Cropping failed: ' + err.message);
  }
  goBtn.disabled = false;
}

function openPreview(url, totalPages, fileCount) {
  const root = document.getElementById('modalRoot');
  root.innerHTML =
    '<div class="modal-bg" id="mbg"><div class="modal">' +
    '<h3>✅ ' + totalPages + (totalPages > 1 ? ' labels' : ' label') + ' ready</h3>' +
    '<div class="tip">From ' + fileCount + (fileCount > 1 ? ' files' : ' file') + ' — invoices removed</div>' +
    '<iframe id="pframe" src="' + url + '"></iframe>' +
    '<div class="tip">Tip: in the print dialog set Paper Size → 4×6 in and Scale → Actual size / 100% for thermal printers.</div>' +
    '<div class="row2"><button class="btn-ghost" id="dlBtn">⬇️ Download</button><button class="btn-primary" id="prBtn">🖨️ Print All</button></div>' +
    '<button class="btn-ghost" id="closeBtn" style="width:100%;">Close</button>' +
    '</div></div>';
  document.getElementById('dlBtn').onclick = () => {
    const a = document.createElement('a'); a.href = url; a.download = 'cropped-labels.pdf'; a.click();
  };
  document.getElementById('prBtn').onclick = () => confirmPrint(url, totalPages);
  document.getElementById('closeBtn').onclick = () => { root.innerHTML = ''; };
}
function confirmPrint(url, totalPages) {
  const box = document.createElement('div');
  box.className = 'confirm';
  box.innerHTML =
    '<div class="box"><h3 style="margin-top:0;">Print ' + totalPages + (totalPages > 1 ? ' labels' : ' label') + '?</h3>' +
    '<div class="tip">Make sure your 4×6 thermal printer is on and loaded.</div>' +
    '<div class="row2" style="margin-top:16px;"><button class="btn-ghost" id="cancelPr">Cancel</button><button class="btn-primary" id="confirmPr">Print</button></div></div>';
  document.body.appendChild(box);
  box.querySelector('#cancelPr').onclick = () => box.remove();
  box.querySelector('#confirmPr').onclick = () => {
    box.remove();
    const frame = document.getElementById('pframe');
    try { frame.contentWindow.focus(); frame.contentWindow.print(); }
    catch (e) { window.open(url, '_blank'); }
  };
}
</script>
</body>
</html>
